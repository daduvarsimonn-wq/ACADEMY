<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070707;
    --panel:#0d0d0d;
    --panel2:#111111;
    --line:#252525;
    --text:#f5f5f5;
    --muted:#858585;
    --green:#75e3a0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* TOP */

.topbar{
    height:70px;
    border-bottom:1px solid var(--line);
    background:rgba(7,7,7,.96);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(15px);
}

.logo{
    font-family:"Space Grotesk",sans-serif;
    font-size:21px;
    font-weight:700;
    letter-spacing:-1px;
}

.top-info{
    display:flex;
    align-items:center;
    gap:15px;
    color:#777;
    font-size:12px;
}

.top-progress{
    width:130px;
    height:5px;
    background:#1d1d1d;
    border-radius:20px;
    overflow:hidden;
}

.top-progress div{
    height:100%;
    width:0%;
    background:#fff;
    transition:.3s;
}

.menu-button{
    display:none;
    border:1px solid var(--line);
    background:#111;
    color:#fff;
    padding:8px 11px;
    border-radius:7px;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:290px 1fr;
    min-height:calc(100vh - 70px);
}

/* SIDEBAR */

.sidebar{
    border-right:1px solid var(--line);
    padding:25px 16px;
    height:calc(100vh - 70px);
    overflow-y:auto;
    position:sticky;
    top:70px;
    background:#080808;
}

.course-box{
    border-bottom:1px solid var(--line);
    padding:0 10px 22px;
    margin-bottom:22px;
}

.course-box small{
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.course-box h2{
    font-family:"Space Grotesk";
    font-size:19px;
    margin-top:8px;
}

.module{
    margin-bottom:22px;
}

.module-title{
    color:#555;
    font-size:9px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    padding:0 10px 8px;
}

.lesson-btn{
    width:100%;
    border:0;
    background:transparent;
    color:#777;
    text-align:left;
    padding:9px 10px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:9px;
    font-size:11px;
    margin-bottom:2px;
}

.lesson-btn:hover{
    background:#141414;
    color:#fff;
}

.lesson-btn.active{
    background:#181818;
    color:#fff;
}

.lesson-btn.completed{
    color:var(--green);
}

.lesson-number{
    width:23px;
    flex-shrink:0;
    font-size:9px;
}

/* MAIN */

.main{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:55px 55px 100px;
}

.eyebrow{
    color:#666;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:14px;
}

h1{
    font-family:"Space Grotesk";
    font-size:clamp(38px,6vw,65px);
    line-height:.98;
    letter-spacing:-3px;
    max-width:850px;
}

.subtitle{
    color:#888;
    max-width:720px;
    font-size:15px;
    line-height:1.8;
    margin-top:20px;
}

.progress-area{
    margin-top:27px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    color:#666;
    font-size:10px;
    margin-bottom:8px;
}

.progress-bar{
    height:5px;
    width:100%;
    background:#1b1b1b;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar div{
    height:100%;
    background:#fff;
    transition:.4s;
}

/* VIDEO */

.video{
    height:330px;
    margin:40px 0;
    border:1px solid var(--line);
    border-radius:17px;
    background:
        radial-gradient(circle at center,#202020 0%,#101010 32%,#080808 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.video:before{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    border:1px solid #292929;
    border-radius:50%;
}

.play{
    position:relative;
    z-index:2;
    width:68px;
    height:68px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:20px;
}

.video-label{
    position:absolute;
    left:20px;
    bottom:18px;
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:2px;
}

/* CONTENT */

.section{
    margin:55px 0;
}

.section h2{
    font-family:"Space Grotesk";
    font-size:28px;
    margin-bottom:22px;
    letter-spacing:-1px;
}

.section p{
    color:#999;
    font-size:15px;
    line-height:1.85;
    margin-bottom:17px;
}

.steps{
    display:grid;
    gap:10px;
}

.step{
    border:1px solid var(--line);
    background:#0c0c0c;
    padding:19px;
    border-radius:11px;
    display:flex;
    gap:15px;
}

.step-number{
    width:28px;
    height:28px;
    min-width:28px;
    border:1px solid #333;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:10px;
}

.step h3{
    font-family:"Space Grotesk";
    font-size:15px;
    margin-bottom:7px;
}

.step p{
    margin:0;
    font-size:12px;
}

/* FRAMEWORK */

.framework{
    border:1px solid #303030;
    background:#101010;
    border-radius:14px;
    padding:25px;
}

.framework-label{
    color:#555;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:9px;
    margin-bottom:10px;
}

.framework-main{
    font-family:"Space Grotesk";
    font-size:25px;
    line-height:1.4;
}

/* CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
    margin-top:25px;
}

.card{
    border:1px solid var(--line);
    background:#0d0d0d;
    border-radius:12px;
    padding:21px;
}

.card h3{
    font-family:"Space Grotesk";
    font-size:16px;
    margin-bottom:8px;
}

.card p{
    color:#777;
    font-size:12px;
    margin:0;
}

/* ASSIGNMENT */

.assignment{
    border-top:1px solid var(--line);
    margin-top:70px;
    padding-top:45px;
}

.assignment-label{
    color:#666;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:9px;
}

.assignment h2{
    font-family:"Space Grotesk";
    font-size:32px;
    margin-top:8px;
    margin-bottom:30px;
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    background:#0b0b0b;
    border:1px solid #292929;
    border-radius:9px;
    color:#fff;
    padding:14px;
    outline:none;
    line-height:1.6;
    font-size:13px;
}

textarea:focus{
    border-color:#666;
}

.save{
    border:0;
    background:#fff;
    color:#000;
    padding:13px 21px;
    border-radius:8px;
    font-weight:700;
}

.status{
    color:#666;
    font-size:11px;
    margin-top:13px;
}

.status.success{
    color:var(--green);
}

/* NAV */

.navigation{
    border-top:1px solid var(--line);
    margin-top:65px;
    padding-top:25px;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.nav{
    border:1px solid #303030;
    background:#111;
    color:#fff;
    padding:13px 20px;
    border-radius:8px;
}

.nav.next{
    background:#fff;
    color:#000;
}

/* MOBILE */

@media(max-width:800px){

    .topbar{
        padding:0 15px;
    }

    .menu-button{
        display:block;
    }

    .top-info{
        display:none;
    }

    .layout{
        display:block;
    }

    .sidebar{
        display:none;
        position:fixed;
        left:0;
        top:70px;
        width:290px;
        height:calc(100vh - 70px);
        z-index:90;
    }

    .sidebar.open{
        display:block;
    }

    .main{
        padding:38px 20px 70px;
    }

    h1{
        letter-spacing:-2px;
    }

    .video{
        height:230px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .navigation{
        position:relative;
    }
}
</style>
</head>

/* =====================================================
   STATE
===================================================== */

var currentLesson = parseInt(
    localStorage.getItem("academyCurrentLesson") || "1",
    10
);

if(
    isNaN(currentLesson) ||
    currentLesson < 1 ||
    currentLesson > 25
){
    currentLesson = 1;
}


/* =====================================================
   HELPERS
===================================================== */

function getLesson(id){
    for(var i=0;i<lessons.length;i++){
        if(lessons[i].id === id){
            return lessons[i];
        }
    }

    return lessons[0];
}


function completionKey(id){
    return "academyLesson" + id + "Complete";
}


function isComplete(id){
    return localStorage.getItem(completionKey(id)) === "true";
}


function getCompletedCount(){

    var total = 0;

    for(var i=0;i<lessons.length;i++){
        if(isComplete(lessons[i].id)){
            total++;
        }
    }

    return total;
}


function getOverallProgress(){

    return Math.round(
        (getCompletedCount() / 25) * 100
    );
}


function answerKey(lessonId,index){

    return "academyLesson" + lessonId + "Answer" + index;
}


/* =====================================================
   SIDEBAR
===================================================== */

function buildSidebar(){

    var list = document.getElementById("lessonList");

    list.innerHTML = "";

    var lastModule = "";

    for(var i=0;i<lessons.length;i++){

        var lesson = lessons[i];

        if(lesson.module !== lastModule){

            lastModule = lesson.module;

            var module = document.createElement("div");

            module.className = "module";

            var moduleTitle = document.createElement("div");

            moduleTitle.className = "module-title";

            moduleTitle.innerHTML =
                lesson.module + " · " + lesson.name;

            module.appendChild(moduleTitle);

            list.appendChild(module);
        }

        var button = document.createElement("button");

        button.className = "lesson-btn";

        if(lesson.id === currentLesson){
            button.className += " active";
        }

        if(isComplete(lesson.id)){
            button.className += " completed";
        }

        button.innerHTML =
            '<span class="lesson-number">' +
            String(lesson.id).padStart(2,"0") +
            '</span>' +

            '<span style="flex:1">' +
            lesson.title +
            '</span>' +

            '<span>' +
            (isComplete(lesson.id) ? "✓" : "") +
            '</span>';

        button.onclick = (function(id){

            return function(){

                currentLesson = id;

                localStorage.setItem(
                    "academyCurrentLesson",
                    String(id)
                );

                renderLesson();

                document.getElementById("sidebar")
                    .classList.remove("open");

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });
            };

        })(lesson.id);

        list.lastChild.appendChild(button);
    }
}


/* =====================================================
   LOAD ANSWERS
===================================================== */

function getAnswer(lessonId,index){

    return localStorage.getItem(
        answerKey(lessonId,index)
    ) || "";
}


/* =====================================================
   SAVE ASSIGNMENT
===================================================== */

function saveAssignment(){

    var lesson = getLesson(currentLesson);

    var complete = true;

    for(var i=0;i<lesson.questions.length;i++){

        var field =
            document.getElementById("answer" + i);

        if(!field){
            continue;
        }

        var value = field.value.trim();

        localStorage.setItem(
            answerKey(currentLesson,i),
            field.value
        );

        if(value === ""){
            complete = false;
        }
    }

    var status =
        document.getElementById("saveStatus");

    if(complete){

        localStorage.setItem(
            completionKey(currentLesson),
            "true"
        );

        if(status){

            status.innerHTML =
                "✓ Assignment complete — lesson marked as completed.";

            status.className =
                "status success";
        }

    }else{

        if(status){

            status.innerHTML =
                "Saved. Complete every field to mark this lesson complete.";

            status.className =
                "status";
        }
    }

    buildSidebar();
    updateProgress();
}


/* =====================================================
   LESSON CONTENT
===================================================== */

function renderLesson(){

    var lesson = getLesson(currentLesson);

    var content =
        document.getElementById("content");

    var positionProgress =
        Math.round((currentLesson / 25) * 100);

    var topicsHTML = "";

    for(var i=0;i<lesson.topics.length;i++){

        topicsHTML +=

        '<div class="step">' +

            '<div class="step-number">' +
                (i+1) +
            '</div>' +

            '<div>' +

                '<h3>' +
                    lesson.topics[i][0] +
                '</h3>' +

                '<p>' +
                    lesson.topics[i][1] +
                '</p>' +

            '</div>' +

        '</div>';
    }


    var cardsHTML = "";

    if(lesson.cards){

        cardsHTML = '<div class="cards">';

        for(var c=0;c<lesson.cards.length;c++){

            cardsHTML +=

            '<div class="card">' +

                '<h3>' +
                    lesson.cards[c][0] +
                '</h3>' +

                '<p>' +
                    lesson.cards[c][1] +
                '</p>' +

            '</div>';
        }

        cardsHTML += '</div>';
    }


    var questionsHTML = "";

    for(var q=0;q<lesson.questions.length;q++){

        questionsHTML +=

        '<div class="field">' +

            '<label>' +
                (q+1) +
                '. ' +
                lesson.questions[q] +
            '</label>' +

            '<textarea id="answer' +
                q +
                '" placeholder="Write your answer here...">' +

                escapeHTML(
                    getAnswer(currentLesson,q)
                ) +

            '</textarea>' +

        '</div>';
    }


    var previousDisabled =
        currentLesson === 1
        ? "disabled"
        : "";


    var nextText =
        currentLesson === 25
        ? "Finish Course"
        : "Next Lesson →";


    content.innerHTML =

    '<div class="eyebrow">' +
        lesson.module +
        ' · ' +
        lesson.name +
    '</div>' +

    '<h1>' +
        lesson.title +
    '</h1>' +

    '<div class="subtitle">' +
        lesson.description +
    '</div>' +

    '<div class="progress-area">' +

        '<div class="progress-text">' +

            '<span>Course position</span>' +

            '<span>' +
                currentLesson +
                ' / 25' +
            '</span>' +

        '</div>' +

        '<div class="progress-bar">' +

            '<div style="width:' +
                positionProgress +
                '%"></div>' +

        '</div>' +

    '</div>' +


    '<div class="video">' +

        '<button class="play" onclick="videoMessage()">' +
            '▶' +
        '</button>' +

        '<div class="video-label">' +
            'Lesson ' +
            String(currentLesson).padStart(2,"0") +
            ' · Video lesson' +
        '</div>' +

    '</div>' +


    '<section class="section">' +

        '<h2>What you need to understand</h2>' +

        '<div class="steps">' +
            topicsHTML +
        '</div>' +

    '</section>' +


    '<section class="section">' +

        '<h2>Core Framework</h2>' +

        '<div class="framework">' +

            '<div class="framework-label">' +
                'Mental model' +
            '</div>' +

            '<div class="framework-main">' +
                lesson.framework +
            '</div>' +

        '</div>' +

    '</section>' +


    '<section class="section">' +

        '<h2>The deeper layer</h2>' +

        cardsHTML +

    '</section>' +


    '<section class="assignment">' +

        '<div class="assignment-label">' +
            'Practical Assignment' +
        '</div>' +

        '<h2>Do the work.</h2>' +

        questionsHTML +

        '<button class="save" onclick="saveAssignment()">' +
            'Save Assignment' +
        '</button>' +

        '<div id="saveStatus" class="status">' +
            'Your answers are saved on this device.' +
        '</div>' +

    '</section>' +


    '<div class="navigation">' +

        '<button class="nav" ' +
            previousDisabled +
            ' onclick="previousLesson()">' +

            '← Previous' +

        '</button>' +


        '<button class="nav next" ' +
            (currentLesson === 25 ? 'disabled' : '') +
            ' onclick="nextLesson()">' +

            nextText +

        '</button>' +

    '</div>';


    buildSidebar();
    updateProgress();
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   NAVIGATION
===================================================== */

function nextLesson(){

    /*
       Save current answers first.
    */

    saveAssignment();

    if(currentLesson >= 25){

        alert(
            "🏆 AGENCY BLUEPRINT COMPLETE!\n\n" +
            "You finished all 25 lessons."
        );

        return;
    }

    currentLesson++;

    localStorage.setItem(
        "academyCurrentLesson",
        String(currentLesson)
    );

    renderLesson();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function previousLesson(){

    if(currentLesson <= 1){
        return;
    }

    currentLesson--;

    localStorage.setItem(
        "academyCurrentLesson",
        String(currentLesson)
    );

    renderLesson();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    var progress =
        getOverallProgress();

    var text =
        document.getElementById("overallText");

    var bar =
        document.getElementById("overallBar");

    if(text){
        text.innerHTML =
            progress +
            "% complete";
    }

    if(bar){
        bar.style.width =
            progress +
            "%";
    }
}


/* =====================================================
   VIDEO
===================================================== */

function videoMessage(){

    alert(
        "🎥 VIDEO AREA\n\n" +
        "This is ready for your actual lesson video.\n\n" +
        "Later we can connect YouTube, Vimeo or MP4 videos here."
    );
}


/* =====================================================
   MOBILE MENU
===================================================== */

function toggleMenu(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowRight"){
            nextLesson();
        }

        if(event.key === "ArrowLeft"){
            previousLesson();
        }

    }
);


/* =====================================================
   START
===================================================== */

renderLesson();

</script>
