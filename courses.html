/* =========================================================
   PAYPAL — MOBILE-SAFE REDIRECT CHECKOUT
========================================================= */

async function startPayPalCheckout() {
    if (!validateStudent()) return;

    const button = document.getElementById("paypalRedirectButton");
    if (button) {
        button.disabled = true;
        button.innerHTML = "<span>OPENING PAYPAL...</span><span class=\"paypal-arrow\">→</span>";
    }

    try {
        const { data: { session } } =
            await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return;
        }

        showStatus("Preparing secure PayPal checkout...");

        const response = await fetch("/api/create-order", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + session.access_token
            }
        });

        const data = await response.json().catch(function() {
            return {};
        });

        if (!response.ok || !data.orderID || !data.approvalUrl) {
            console.error("Create order error:", data);
            throw new Error(
                data.error || "Could not open PayPal checkout."
            );
        }

        // Full-page redirect instead of the PayPal popup/new-tab flow.
        // This is much more reliable on iPhone/mobile browsers.
        window.location.assign(data.approvalUrl);
    }
    catch (error) {
        console.error("PayPal redirect error:", error);
        showStatus(
            error.message ||
            "PayPal could not open. Please try again."
        );

        if (button) {
            button.disabled = false;
            button.innerHTML = "<span>PAY WITH PAYPAL</span><span class=\"paypal-arrow\">→</span>";
        }
    }
}

async function finishPayPalReturn() {
    const params = new URLSearchParams(window.location.search);
    const paypalState = params.get("paypal");
    const orderID = params.get("token");

    if (paypalState === "cancel") {
        showStatus("Payment cancelled. You can try again whenever you're ready.");
        history.replaceState({}, document.title, "courses.html");
        return;
    }

    if (paypalState !== "return" || !orderID) {
        return;
    }

    try {
        checkoutOverlay.classList.add("show");
        document.body.style.overflow = "hidden";
        showStatus("Payment approved. Securely completing your purchase...");

        const { data: { session } } =
            await supabaseClient.auth.getSession();

        if (!session) {
            showStatus("Your login session expired. Please log in again.");
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);
            return;
        }

        const response = await fetch("/api/capture-order", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + session.access_token
            },
            body: JSON.stringify({
                orderID: orderID
            })
        });

        const result = await response.json().catch(function() {
            return {};
        });

        if (!response.ok || !result.success) {
            console.error("Capture order error:", result);
            throw new Error(
                result.error || "Payment could not be completed."
            );
        }

        showStatus("Payment successful! Your course is unlocked. Opening...");

        // Clean the PayPal query from the address bar before leaving.
        history.replaceState({}, document.title, "courses.html");

        setTimeout(function() {
            window.location.replace("lesson.html");
        }, 700);
    }
    catch (error) {
        console.error("PayPal return error:", error);
        showStatus(
            error.message ||
            "Payment could not be completed. Please contact support if you were charged."
        );
    }
}

/* =========================================================
   FILTER SYSTEM
========================================================= */

const filters =
    document.querySelectorAll(
        ".filter"
    );

const cards =
    document.querySelectorAll(
        ".course-card"
    );


filters.forEach(
    function(filter) {

        filter.addEventListener(
            "click",
            function() {

                filters.forEach(
                    function(item) {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                filter.classList.add(
                    "active"
                );


                const selected =
                    filter.dataset.filter;


                cards.forEach(
                    function(card) {

                        if (
                            selected ===
                            "all"
                        ) {

                            card.style.display =
                                "flex";

                            return;

                        }


                        const categories =
                            card.dataset.category
                                .split(" ");


                        if (
                            categories.includes(
                                selected
                            )
                        ) {

                            card.style.display =
                                "flex";

                        }

                        else {

                            card.style.display =
                                "none";

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeCheckout();

        }

    }
);
